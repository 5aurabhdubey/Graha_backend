events {
  worker_connections 1024;
}

http {
  # least_conn sends each new request to whichever backend currently has
  # the fewest active connections — better than plain round-robin here,
  # since chat requests can take a few seconds (they wait on OpenAI) while
  # kundali/panchang requests are quick, so connection count evens out load
  # better than a blind rotation would.
  upstream graha_backend {
    least_conn;
    server app1:8080 max_fails=3 fail_timeout=30s;
    server app2:8080 max_fails=3 fail_timeout=30s;
    server app3:8080 max_fails=3 fail_timeout=30s;
  }

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

  server {
    listen 80;

    location /health {
      access_log off;
      proxy_pass http://graha_backend;
    }

    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;

      proxy_pass http://graha_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Chat calls wait on OpenAI — give them more room than nginx's defaults.
      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;

      # If a backend instance is unhealthy, retry the request on the next one
      # automatically rather than surfacing the failure to the user.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
